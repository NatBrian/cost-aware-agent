# foundation.yaml — SINGLE source of truth for every constant in the foundation
# run. No constant may be hard-coded elsewhere; modules load this file.
# Plan: research/paper_plan_v2_1_foundation.md  ·  Tasks: research/foundation_tasks/
# Values marked PROVISIONAL are frozen only after the F2 pilot memo is approved.

seed: 42

data:
  train_size: 300
  dev_size: 200
  val_size: 50                     # tuning slice: EVERY refinement decision reads
                                   # this, never dev-200 (anti-overfitting policy).
                                   # probe_policy_health.sh needs it; nothing
                                   # generated it before 2026-07-28.
  sampling_seed: 42
  stratify_field: level            # HotpotQA official easy/medium/hard
  data_dir: ../data_shared         # -> /mnt/src/liangsheng/cassi_foundation
                                   # (symlink; persistent CPFS, survives the
                                   # container wipes that cost us the first run)
  out_dir: data                    # foundation/data/ (gitignored)
  train_file: data/hotpotqa_train_300.jsonl
  dev_file: data/hotpotqa_dev_200.jsonl
  val_file: data/hotpotqa_val_50.jsonl
  manifest_file: data/manifest.json
  source_train: ../data_shared/hotpotqa_train.jsonl   # built by scripts/f1_data.py
  source_dev: ../data_shared/hotpotqa_dev.jsonl       # from the HF parquet

retrieval:
  index_dir: ../data_shared/searchr1_index
  backend: e5                      # falls back to bm25 if index unusable (F1)
  top_k: 3
  endpoint: http://127.0.0.1:8377  # local retrieval server (8001 belongs to another user's service)

episode:
  t_max: 10                        # hard cap, all arms
  budgets: {small: 2, medium: 4, large: 8}    # FROZEN from pilot 2026-07-22 (P25/P75/~P90 of steps-to-95%-peak)
  draft_retry: 1                   # malformed draft line -> 1 retry -> EMPTY_DRAFT

economy:
  lambda: 0.3                      # FROZEN from pilot: knee at step 3 becomes interior optimum at B=4
  lambda_spot: 0.1
  # U = F1 - lambda * (steps_used / B)

executor:
  model: Qwen/Qwen3.5-9B           # hub id: identity in logs/reports
  model_path: ../data_shared/models/Qwen3.5-9B   # local weights on persistent
                                   # storage. Used for serving, tokenizer, init
                                   # AND the untrained-tensor merge — the merge
                                   # used to snapshot_download the hub repo every
                                   # round, i.e. 19G per round for bytes already
                                   # on disk. (2026-07-28)
  enable_thinking: false
  endpoint: http://127.0.0.1:8378/v1   # vLLM OpenAI-compatible (8000 too contested on this shared box)
  eval_temperature: 0.0
  rollout_temperature: 1.0
  max_tokens_per_step: 512
  max_model_len: 16384             # served ctx; trainer drops samples above it.
                                   # MUST match scripts/e5_round.sh --max-model-len:
                                   # a lower trainer cap silently drops long
                                   # (= late-step) samples, biasing training
                                   # against exactly the over-continuation we
                                   # are trying to punish (audit 2026-07-28)

judge:                             # the prompted reward model (lab vLLM server)
  model: Qwen3.6-27B               # Brian 2026-07-28 (was gemma-4-31B-it on :6102).
                                   # Emits CoT into content unless the client sends
                                   # chat_template_kwargs.enable_thinking=false —
                                   # judge_client does. max_model_len 32768 (gemma
                                   # had 262144), so watch late-step prompt length.
  endpoint: http://122.11.227.227:6101/v1
  temperature: 0.0
  max_tokens: 1024                 # was 512: with thinking off the reply is just
                                   # JSON, but an undersized cap truncates the tail
                                   # and a truncated reply reads as a parse failure
                                   # = neutral 0.5 = a silent hole in the reward
  batch_size: 16
  parse_retries: 1                 # then neutral score 0.5, failure logged
  cache_dir: cache/judge           # keyed (rubric_version, input_hash)

rubric:
  version: rubric_v4
  step_bits: {new_info: 0.4, not_redundant: 0.3, was_needed: 0.3}
  answer_bits: {supported: 0.5, nothing_left: 0.5}
  alpha: 0.2                       # r_t = alpha * (score - 0.5)
  calibration: {n_steps: 150, per_bit_gate: 0.80, per_bit_floor: 0.70}   # 50 gave a per-bit 95% CI of +-0.17 —
                                   # too wide to tell rubric revisions from noise (2026-07-28)

reward:
  format_weight: 0.1
  # R_final = F1(answer, gold) - lambda * (steps_used / B) + format_weight * format_ok

grpo:
  group_size: 8
  lr: 2.0e-6                      # was 5e-6: round-1 damaged temp-1.0 sampling (71% malformed)
  kl_beta: 0.1                    # was .04: stronger round-start anchor after distribution damage
  clip_eps: 0.2
  length_norm: dr_grpo             # mandatory hygiene (plan §4)
  advantage: step_returns_to_go    # group-normalized per step
  min_cohort: 3                    # fewer alive at step t -> trajectory baseline
  accum: 32                        # samples per update (micro-run: 8 was too hot w/ lr 5e-6)
  rounds: 3                        # round-synced on-policy passes (E-e)
  algorithm: grpo                  # PPO = pre-agreed collapse fallback only (F5)

pilot:
  n_tasks: 50
  rollouts_per_task: 4
  mode: forced_continuation

gate:                              # pre-registered GO/NO-GO (plan §6) — frozen
  budget: medium                   # gate evaluated at this wallet
  min_self_stop: 0.70              # A3 harness-off self-termination rate
  f1_margin: 0.05                  # A3 F1 >= A2 F1 - margin
  bootstrap_resamples: 10000

tracking:
  wandb_project: cassi-foundation
  results_dir: experiments/results
  reports_dir: experiments/reports
